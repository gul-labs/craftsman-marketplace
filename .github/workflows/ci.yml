name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests, including those from forks, receive only the read permission CI needs.
permissions:
  contents: read

jobs:
  check-invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned full SHAs keep a changed action tag from changing CI behavior silently.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Run invariant checks
        run: node scripts/check-invariants.mjs
      - name: Run lint-audit CLI checks
        run: node scripts/check-eslint-rule-audit.mjs

  taxcraft-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Pinned full SHAs keep a changed action tag from changing CI behavior silently.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Despite living in evals/, these are deterministic offline tests: JSON Schema
      # validation, structural markdown checks, and fixture assertions. No model is
      # invoked and nothing reaches the network, so this job costs runner minutes only.
      # The whole suite runs in ~3s. jsonschema and markdown-it-py are the only
      # third-party imports, and only evals/ uses them - tools/ stays stdlib-only.
      # The PDF fixture tests under tools/form-parser and tools/pdf-extractor need
      # poppler (pdftotext/pdftoppm/pdfinfo/pdffonts). Without it they SKIP, and a
      # skipped fixture corpus is not a gate, so install it here.
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Install eval dependencies
        run: pip install --disable-pip-version-check jsonschema markdown-it-py
      - name: Run taxcraft evals
        working-directory: plugins/taxcraft/skills/tax
        # validate_corporate_records.py runs here too now. Its fixture loop builds a
        # TemporaryDirectory, points WORKSPACE at it and materializes every file the
        # clean artifact cites, the way run_generic_specialist_fixtures() already did;
        # before that it needed entities/test-corp/** files no clean checkout has.
        # test_no_skill_writes.py runs the whole suite again against a read-only copy
        # of the skill. An installed plugin is read-only for most users, so anything
        # writing inside the skill tree crashes there and nowhere else.
        # Accumulate exit codes explicitly rather than relying on `set -e`, which does
        # not reliably abort from inside a loop body. This also runs every script
        # instead of stopping at the first failure, so one PR shows every break.
        run: |
          failed=0
          for f in \
            evals/rules_freshness.py \
            evals/test_matrix_scoping.py \
            evals/test_no_skill_writes.py \
            evals/validate_close_estimate.py \
            evals/validate_corporate_records.py \
            evals/validate_individual_matrix.py \
            evals/validate_individual_structure.py \
            evals/validate_rules.py \
            evals/validate_stock_issuance.py \
            tools/parse-verify/test_verify.py \
            tools/pdf-extractor/test_pdf_extract.py \
            tools/form-parser/test_form_parser.py \
            tools/form-parser/invariants.py \
            tools/workspace-doctor/test_doctor.py \
          ; do
            echo "--- $f"
            if ! python3 -B "$f"; then
              echo "::error file=plugins/taxcraft/skills/tax/$f::eval failed"
              failed=1
            fi
          done
          exit "$failed"
      # dep-check's INSTALL_MARKERS list rots silently: rename a shipped file and the
      # preflight starts reporting a healthy install as broken, which sends a user to
      # reinstall a plugin that was fine. The runner has no poppler, so the exit code
      # is expected to be non-zero - assert on the install-integrity check alone.
      - name: Check dep-check install markers still resolve
        working-directory: plugins/taxcraft/skills/tax
        run: |
          python3 -B tools/dep-check/dep_check.py --json > /tmp/dep-check.json || true
          python3 - <<'PY'
          import json, sys
          report = json.load(open("/tmp/dep-check.json"))
          install = next(c for c in report["checks"] if c["kind"] == "install")
          if not install["present"]:
              print(f"::error file=plugins/taxcraft/skills/tax/tools/dep-check/dep_check.py::"
                    f"INSTALL_MARKERS is stale: {install['detail']}")
              sys.exit(1)
          print("dep-check install markers resolve")
          PY
